[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = .ansible/collections
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
forks = 4

[ssh_connection]
pipelining = True
ssh_args = -o BatchMode=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
