# Canary drop-in for the controller timer on normandy: run the compiled
# UpKeeper binary instead of the Python launcher, without editing the committed
# unit.
#
# Install it as ~/.config/systemd/user/upkeeper-pull.service.d/10-upkeeper-binary.conf
# and run `systemctl --user daemon-reload`. Rolling back is `rm` of this file
# plus another daemon-reload.
[Service]
ExecStart=
ExecStart=%h/.local/bin/upkeeper scheduled-pull
