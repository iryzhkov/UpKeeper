# Canary drop-in: run the compiled UpKeeper binary instead of the Python
# launcher, without editing the committed unit.
#
# Install it as ~/.config/systemd/user/upkeeper-self.service.d/10-upkeeper-binary.conf
# and run `systemctl --user daemon-reload`. Rolling back is `rm` of this file
# plus another daemon-reload: the committed unit and scripts/upkeeper-self-pull
# are never touched, so the Python path stays exactly one command away.
[Service]
ExecStart=
ExecStart=%h/.local/bin/upkeeper self-pull
