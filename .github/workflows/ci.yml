---
name: phase-1-gate

on:
  # Pushes to main only: a pull request's commits are already tested by its
  # pull_request run, so a push trigger on every branch tested each one twice.
  push:
    branches: [main]
  pull_request:

# A newer commit on the same branch or pull request supersedes the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Jobs run on GitHub-hosted Ubuntu 24.04 runners, pinned rather than
# ubuntu-latest so that the image changes only by an edit here. The agent-a
# self-hosted runners (labels self-hosted, upkeeper) used from 2026-10-06 are no
# longer registered, and runs queued for them never started; hosted minutes for
# this private repository were approved on 2026-10-27.
jobs:
  # Validate the published manifest before dependent production Go checks.
  manifest-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # V1 compatibility fixtures require the complete repository history.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Published manifest is valid and canonical
        run: make ci-manifest

  # The race detector covers every package and every runnable test, divided into
  # four exhaustive groups that the script derives and checks on each run, so
  # that each group is its own race binary under the default ten-minute alarm.
  # Every group must pass; fail-fast is off so one failure does not hide another.
  go-race:
    needs: manifest-gate
    name: go-race (${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [author-baseline, author-catalog, author-other, other-packages]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # V1 compatibility fixtures require the complete repository history.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Race detector
        run: make ci-race GROUP="${{ matrix.group }}"

  go-checks:
    needs: manifest-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # V1 compatibility fixtures require the complete repository history.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Production Go checks
        run: make ci-go-checks

  # Always run the required check, and fail on failed or skipped dependencies.
  go-gate:
    needs: [manifest-gate, go-checks, go-race]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every required Go check passed
        env:
          MANIFEST_RESULT: ${{ needs.manifest-gate.result }}
          CHECKS_RESULT: ${{ needs.go-checks.result }}
          RACE_RESULT: ${{ needs.go-race.result }}
        run: make ci-go-gate

  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No setup-python: the image's python3 only bootstraps the pinned uv in a
      # venv, and `uv sync --python 3.11` (make ci-python) provides the pinned
      # interpreter itself, the same way on hosted runners and locally.
      - name: Python and Ansible checks
        run: make ci-python
