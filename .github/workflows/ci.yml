---
name: phase-1-gate

on:
  push:
  pull_request:

jobs:
  # The race detector covers every package and every runnable test, divided into
  # three exhaustive groups that the script derives and checks on each run, so
  # that each group is its own race binary under the default ten-minute alarm.
  # Every group must pass; fail-fast is off so one failure does not hide another.
  go-race:
    name: go-race (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [author-catalog, author-other, other-packages]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # V1 compatibility fixtures archive the immutable pre-v2 source commit.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.24"
          check-latest: true
      - name: Prepare pinned semantic policy test inputs
        run: bash scripts/prepare-policy-test-inputs.sh
      - name: Race detector
        run: python3 scripts/go-race-shards.py --group "${{ matrix.group }}"

  # The Go binary is the production path, so its gate runs on its own: a
  # failure here is a release blocker, independent of the reference
  # implementation's gate below. It cannot conclude success unless every race
  # group did: it runs its own checks regardless, then fails on any race result
  # other than success.
  go-gate:
    needs: go-race
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # V1 compatibility fixtures archive the immutable pre-v2 source commit.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.24"
          check-latest: true
      - name: Prepare pinned semantic policy test inputs
        run: bash scripts/prepare-policy-test-inputs.sh
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Cross-build both fleet architectures
        run: |
          make go-cross
          sha256sum bin/upkeeper-linux-amd64 bin/upkeeper-linux-arm64
      - name: The production binary needs no interpreter
        run: |
          go build -o /tmp/upkeeper ./cmd/upkeeper
          /tmp/upkeeper version
      - name: Every race detector group passed
        if: ${{ always() }}
        env:
          RACE_RESULT: ${{ needs.go-race.result }}
        run: |
          echo "go-race result: $RACE_RESULT"
          test "$RACE_RESULT" = success

  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.12
          uv sync --locked --all-extras
      - name: Install pinned Ansible collections
        run: uv run ansible-galaxy collection install -r requirements.yml
      - name: Python lint
        run: uv run ruff check src tests scripts
      - name: YAML lint
        run: uv run yamllint requirements.yml inventory desired playbooks tests/fixtures .forgejo .github
      - name: Ansible lint
        run: uv run python scripts/run-captured ansible-lint --offline playbooks
      - name: Unit tests
        run: uv run pytest
      - name: Redaction gate
        run: uv run pytest tests/test_redaction.py
      - name: Ansible syntax
        run: |
          uv run ansible-playbook playbooks/status.yml --syntax-check >ansible-syntax.log 2>&1
          sed -n '1,200p' ansible-syntax.log
      - name: Read-only check mode
        run: |
          uv run ansible-playbook -i tests/fixtures/localhost_inventory.yml playbooks/status.yml --check >ansible-check.log 2>&1
          sed -n '1,200p' ansible-check.log
