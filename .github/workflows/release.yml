---
name: release

# A host installs the binary this workflow publishes, never one built on a
# laptop. The artifacts are produced from the tagged commit by the same
# `make go-cross` the gate runs, and their checksums are published beside them
# so that what a host installed can be checked against what was released.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # Tag pushes and CI start concurrently. Wait for the exact commit's push
      # gate; a failed, missing or timed-out gate never reaches publication.
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-ci.py
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # Pinned rather than floating: the release notes record the exact
          # toolchain, and -trimpath only makes a build reproducible for
          # somebody who uses the same compiler.
          go-version-file: go.mod
          check-latest: false
      - name: Build both fleet architectures
        run: make go-cross
      - name: Attest both release binaries
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            bin/upkeeper-linux-amd64
            bin/upkeeper-linux-arm64
      - name: Record the toolchain and the checksums
        run: |
          GOTOOLCHAIN=$(awk '/^toolchain / {print $2}' go.mod) go version | tee bin/TOOLCHAIN
          ./bin/upkeeper-linux-amd64 version
          cd bin
          sha256sum upkeeper-linux-amd64 upkeeper-linux-arm64 | tee SHA256SUMS
      - name: Write the release notes
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          {
            echo "UpKeeper ${GITHUB_REF_NAME}, built from ${GITHUB_SHA}"
            echo "with $(cat bin/TOOLCHAIN)."
            echo
            echo "Install the artifact for the host's architecture at"
            echo "\$HOME/.local/bin/upkeeper and check it against SHA256SUMS."
            echo "\`upkeeper version\` prints the source commit it was built from."
            echo
            echo '```'
            cat bin/SHA256SUMS
            echo '```'
          } > bin/NOTES.md
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "Provenance attestation was skipped because the repository is private." >> bin/NOTES.md
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file bin/NOTES.md \
            bin/upkeeper-linux-amd64 \
            bin/upkeeper-linux-arm64 \
            bin/SHA256SUMS
