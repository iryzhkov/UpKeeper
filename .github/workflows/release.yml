---
name: release

# A host installs the binary this workflow publishes, never one built on a
# laptop. The artifacts are produced from the tagged commit by the same
# `make go-cross` the gate runs, and their checksums are published beside them
# so that what a host installed can be checked against what was released.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          # Pinned rather than floating: the release notes record the exact
          # toolchain, and -trimpath only makes a build reproducible for
          # somebody who uses the same compiler.
          go-version: "1.24"
          check-latest: false
      - name: Prepare pinned semantic policy test inputs
        run: bash scripts/prepare-policy-test-inputs.sh
      - name: Gate
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build both fleet architectures
        run: make go-cross
      - name: Record the toolchain and the checksums
        run: |
          go version | tee bin/TOOLCHAIN
          ./bin/upkeeper-linux-amd64 version
          cd bin
          sha256sum upkeeper-linux-amd64 upkeeper-linux-arm64 | tee SHA256SUMS
      - name: Write the release notes
        run: |
          {
            echo "UpKeeper ${GITHUB_REF_NAME}, built from ${GITHUB_SHA}"
            echo "with $(cat bin/TOOLCHAIN)."
            echo
            echo "Install the artifact for the host's architecture at"
            echo "~/.local/bin/upkeeper and check it against SHA256SUMS."
            echo "\`upkeeper version\` prints the source commit it was built from."
            echo
            echo '```'
            cat bin/SHA256SUMS
            echo '```'
          } > bin/NOTES.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file bin/NOTES.md \
            bin/upkeeper-linux-amd64 \
            bin/upkeeper-linux-arm64 \
            bin/SHA256SUMS
